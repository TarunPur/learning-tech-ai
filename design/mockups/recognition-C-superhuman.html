<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Screen 1 — Variation C (Superhuman premium)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F3F1EC;
  --ink:#1D1B22;
  --ink-soft:#5B5866;
  --ink-faint:#918D9E;
  --line:rgba(29,27,34,0.10);
  --line-soft:rgba(29,27,34,0.06);
  --violet:#6355D8;
  --violet-deep:#4A3EB0;
  --violet-tint:rgba(99,85,216,0.09);
  --violet-tint-2:rgba(99,85,216,0.15);
  --card:#FFFFFF;
  --shadow:0 1px 2px rgba(30,26,50,0.05),0 14px 34px -18px rgba(30,26,50,0.24);
  --shadow-lift:0 8px 20px -8px rgba(30,26,50,0.16),0 30px 56px -24px rgba(30,26,50,0.32);
  --r:16px;
}
*{box-sizing:border-box;}
body{margin:0;color:var(--ink);background:var(--bg);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
::selection{background:var(--violet-tint-2);color:var(--violet-deep);}
:focus-visible{outline:2.5px solid var(--violet);outline-offset:3px;border-radius:10px;}
button{font-family:inherit;color:inherit;}

.hero{position:relative;overflow:hidden;padding:26px 24px 0;}
.hero::before{content:"";position:absolute;top:-160px;right:-80px;width:520px;height:420px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(150,170,255,0.55), rgba(210,180,255,0.30) 45%, transparent 70%);filter:blur(20px);pointer-events:none;}
.hero-in{position:relative;max-width:880px;margin:0 auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 0;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center;}
.brand .wm{font-weight:700;font-size:14px;letter-spacing:0.02em;color:var(--ink);}
.brand .wm small{display:block;font-weight:500;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
.chip-top{font-size:12px;font-weight:600;color:var(--violet-deep);background:var(--violet-tint);border:1px solid var(--violet-tint-2);border-radius:999px;padding:6px 13px;}

.headline{max-width:820px;margin:0 auto;padding:60px 0 44px;text-align:center;}
.headline h1{font-family:"Bricolage Grotesque";font-weight:600;font-size:clamp(34px,5vw,58px);line-height:1.03;letter-spacing:-0.03em;margin:0;color:var(--ink);text-wrap:balance;}
.headline p{margin:18px auto 0;max-width:44ch;color:var(--ink-soft);font-size:17px;line-height:1.5;}

.panel{max-width:720px;margin:0 auto;padding:0 24px 48px;}
.rows{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow);transition:transform .26s cubic-bezier(.16,1,.3,1),box-shadow .26s ease,border-color .2s;}
.row:hover,.row:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--violet-tint-2);outline:none;}
.n{flex:none;width:26px;font-family:"Bricolage Grotesque";font-weight:600;font-size:14px;color:var(--ink-faint);font-variant-numeric:tabular-nums;text-align:center;}
.ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;transition:background .2s,color .2s,border-color .2s;}
.ic svg{width:22px;height:22px;}
.row:hover .ic{background:var(--violet);border-color:var(--violet);color:#fff;}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;}
.tx .t{font-family:"Bricolage Grotesque";font-weight:600;font-size:17px;letter-spacing:-0.01em;line-height:1.2;margin-bottom:2px;}
.tx .e{font-size:13.5px;line-height:1.4;color:var(--ink-soft);}
.tx .e i{font-style:normal;color:var(--ink-faint);}
.go{flex:none;color:var(--ink-faint);opacity:.7;transition:color .2s,transform .26s,opacity .2s;}
.row:hover .go{color:var(--violet);transform:translateX(3px);opacity:1;}

.escape{margin-top:12px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;background:transparent;border:1.5px dashed var(--line);border-radius:var(--r);padding:15px 18px;transition:border-color .2s,background .2s;}
.escape:hover{border-color:var(--violet);background:var(--card);}
.escape .n{color:var(--ink-faint);}
.escape .ic{background:transparent;border-style:dashed;color:var(--ink-faint);}
.escape .t{font-family:"Bricolage Grotesque";font-weight:600;font-size:15.5px;}
.escape .e{font-size:13px;color:var(--ink-soft);}

.foot{max-width:720px;margin:0 auto;padding:0 24px 44px;display:flex;align-items:center;justify-content:center;gap:9px;color:var(--ink-soft);font-size:13px;}
.foot svg{color:var(--violet);flex:none;}

@media (prefers-reduced-motion:no-preference){
  .anim{opacity:0;transform:translateY(12px);animation:s .66s cubic-bezier(.16,1,.3,1) forwards;}
  .a1{animation-delay:.04s}.a2{animation-delay:.12s}.a3{animation-delay:.20s}.a4{animation-delay:.28s}.a5{animation-delay:.35s}.a6{animation-delay:.42s}.a7{animation-delay:.49s}
  @keyframes s{to{opacity:1;transform:none}}
}
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-in">
      <div class="topbar anim a1">
        <div class="brand">
          <span class="logo" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6A2.5 2.5 0 0 1 17.5 15H9l-4 3.5V15H6.5" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 9.2l1.8 1.8 3.4-3.7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="wm">Outreach Bench<small>placeholder name</small></span>
        </div>
        <span class="chip-top">Held to a real expert standard</span>
      </div>
      <div class="headline anim a2">
        <h1>Which message do you need to send?</h1>
        <p>Pick the one closest to your situation. You make the calls — we shape it with you, to an expert standard.</p>
      </div>
    </div>
  </header>

  <section class="panel">
    <div class="rows">
      <button class="row anim a3" type="button"><span class="n">01</span><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6A2.5 2.5 0 0 1 17.5 15H9l-4 3.5V15H6.5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10.5 8v3M13.5 8v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="tx"><span class="t">A prospect went quiet</span><span class="e"><i>e.g.</i> They were keen, then stopped replying two weeks ago.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <button class="row anim a4" type="button"><span class="n">02</span><span class="ic"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5.5" width="16" height="14" rx="2.6" stroke="currentColor" stroke-width="1.7"/><path d="M4 9.5h16M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9 14.2l2 2 3.5-3.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx"><span class="t">Book a meeting or demo</span><span class="e"><i>e.g.</i> Get 20 minutes on their calendar this week.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <button class="row anim a5" type="button"><span class="n">03</span><span class="ic"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M6 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M19 5.5v3M17.5 7h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="tx"><span class="t">Reach out to someone new</span><span class="e"><i>e.g.</i> A first message to a prospect who's never heard of you.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <button class="row anim a6" type="button"><span class="n">04</span><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 11.2 11 4.7a2 2 0 0 1 1.5-.6l4.3.2a2 2 0 0 1 1.9 1.9l.2 4.3a2 2 0 0 1-.6 1.5l-6.5 6.5a2 2 0 0 1-2.8 0l-4.2-4.2a2 2 0 0 1 0-2.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="15.4" cy="8.6" r="1.3" fill="currentColor"/></svg></span><span class="tx"><span class="t">Follow up after meeting them</span><span class="e"><i>e.g.</i> You spoke at an event and said you'd be in touch.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    </div>
    <button class="escape anim a7" type="button"><span class="n"></span><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span class="tx"><span class="t">Something else</span><span class="e">A different outreach message you need to write.</span></span></button>
  </section>

  <div class="foot anim a7"><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 1.8 3 4v4.2c0 3.7 2.5 6.3 6 8 3.5-1.7 6-4.3 6-8V4L9 1.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.4 9.1l1.7 1.7L12 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Real names are swapped out before anything is saved.</div>
</body>
</html>

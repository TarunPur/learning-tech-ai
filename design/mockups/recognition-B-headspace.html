<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Screen 1 — Variation B (Headspace calm)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#212934;
  --ink-soft:#5A6472;
  --ink-faint:#8B94A2;
  --line:rgba(33,41,52,0.09);
  --blue:#2E6FE0;
  --blue-deep:#1E52B0;
  --blue-tint:rgba(46,111,224,0.10);
  --card:#FFFFFF;
  --peach:#FFE9DC;--peach-i:#E8804A;
  --mint:#DCF3EA;--mint-i:#20946A;
  --lilac:#E9E4FB;--lilac-i:#7C63D6;
  --sun:#FDEFC8;--sun-i:#D69B1E;
  --shadow:0 2px 6px rgba(30,60,120,0.06),0 20px 50px -22px rgba(30,60,120,0.28);
  --shadow-lift:0 6px 14px rgba(30,60,120,0.10),0 26px 54px -20px rgba(30,60,120,0.34);
  --r:20px;
}
*{box-sizing:border-box;}
body{margin:0;color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:linear-gradient(170deg,#CFE6FF 0%,#E6F2FF 42%,#F3F8FF 100%);}
::selection{background:var(--blue-tint);color:var(--blue-deep);}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:12px;}
button{font-family:inherit;color:inherit;}

.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand .logo{width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;}
.brand .wm{font-weight:700;font-size:15px;color:var(--ink);}
.brand .wm small{display:block;font-weight:500;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}

.card{width:100%;max-width:560px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:34px 32px 30px;}
h1{font-family:"Bricolage Grotesque";font-weight:600;font-size:clamp(25px,3.2vw,31px);line-height:1.1;letter-spacing:-0.02em;margin:0 0 8px;text-align:center;text-wrap:balance;}
.lead{margin:0 auto 24px;color:var(--ink-soft);font-size:15.5px;line-height:1.45;text-align:center;max-width:38ch;}

.rows{display:flex;flex-direction:column;gap:11px;}
.row{display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;background:#FBFCFE;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:transform .24s cubic-bezier(.16,1,.3,1),box-shadow .24s ease,background .2s;}
.row:hover,.row:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow-lift);background:#fff;outline:none;}
.tile{flex:none;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;}
.tile svg{width:26px;height:26px;}
.t1{background:var(--peach);color:var(--peach-i);}
.t2{background:var(--mint);color:var(--mint-i);}
.t3{background:var(--lilac);color:var(--lilac-i);}
.t4{background:var(--sun);color:var(--sun-i);}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;}
.tx .t{font-family:"Bricolage Grotesque";font-weight:600;font-size:16.5px;letter-spacing:-0.01em;line-height:1.2;margin-bottom:2px;}
.tx .e{font-size:13.5px;line-height:1.4;color:var(--ink-soft);}
.tx .e i{font-style:normal;color:var(--ink-faint);}
.go{flex:none;color:var(--ink-faint);opacity:.7;transition:color .2s,transform .24s,opacity .2s;}
.row:hover .go{color:var(--blue);transform:translateX(3px);opacity:1;}

.escape{margin-top:12px;display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;background:transparent;border:1.5px dashed var(--line);border-radius:var(--r);padding:13px 16px;transition:border-color .2s,background .2s;}
.escape:hover{border-color:var(--blue);background:#FBFCFE;}
.escape .tile{background:transparent;border:1.5px dashed var(--line);color:var(--ink-faint);width:46px;height:46px;}
.escape .t{font-family:"Bricolage Grotesque";font-weight:600;font-size:15px;}
.escape .e{font-size:13px;color:var(--ink-soft);}

.trust{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:9px;color:var(--ink-soft);font-size:13px;}
.trust svg{color:var(--blue);flex:none;}

@media (prefers-reduced-motion:no-preference){
  .anim{opacity:0;transform:translateY(12px);animation:s .6s cubic-bezier(.16,1,.3,1) forwards;}
  .a1{animation-delay:.05s}.a2{animation-delay:.12s}.a3{animation-delay:.19s}.a4{animation-delay:.26s}.a5{animation-delay:.33s}.a6{animation-delay:.40s}.a7{animation-delay:.47s}
  @keyframes s{to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand anim a1">
    <span class="logo" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6A2.5 2.5 0 0 1 17.5 15H9l-4 3.5V15H6.5" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 9.2l1.8 1.8 3.4-3.7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="wm">Outreach Bench<small>placeholder name</small></span>
  </div>

  <div class="card">
    <h1 class="anim a2">Which message do you need to send?</h1>
    <p class="lead anim a3">Pick the one closest to your situation — you make the calls, we shape it with you.</p>
    <div class="rows">
      <button class="row anim a4" type="button"><span class="tile t1"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6A2.5 2.5 0 0 1 17.5 15H9l-4 3.5V15H6.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10.5 8v3M13.5 8v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="tx"><span class="t">A prospect went quiet</span><span class="e"><i>e.g.</i> They were keen, then stopped replying two weeks ago.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <button class="row anim a5" type="button"><span class="tile t2"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5.5" width="16" height="14" rx="2.6" stroke="currentColor" stroke-width="1.8"/><path d="M4 9.5h16M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 14.2l2 2 3.5-3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx"><span class="t">Book a meeting or demo</span><span class="e"><i>e.g.</i> Get 20 minutes on their calendar this week.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <button class="row anim a6" type="button"><span class="tile t3"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M6 19.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 5.5v3M17.5 7h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="tx"><span class="t">Reach out to someone new</span><span class="e"><i>e.g.</i> A first message to a prospect who's never heard of you.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
      <button class="row anim a7" type="button"><span class="tile t4"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 11.2 11 4.7a2 2 0 0 1 1.5-.6l4.3.2a2 2 0 0 1 1.9 1.9l.2 4.3a2 2 0 0 1-.6 1.5l-6.5 6.5a2 2 0 0 1-2.8 0l-4.2-4.2a2 2 0 0 1 0-2.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="15.4" cy="8.6" r="1.3" fill="currentColor"/></svg></span><span class="tx"><span class="t">Follow up after meeting them</span><span class="e"><i>e.g.</i> You spoke at an event and said you'd be in touch.</span></span><span class="go"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    </div>
    <button class="escape anim a7" type="button"><span class="tile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="tx"><span class="t">Something else</span><span class="e">A different outreach message you need to write.</span></span></button>
    <div class="trust anim a7"><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M9 1.8 3 4v4.2c0 3.7 2.5 6.3 6 8 3.5-1.7 6-4.3 6-8V4L9 1.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.4 9.1l1.7 1.7L12 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Real names are swapped out before anything is saved.</div>
  </div>
</div>
</body>
</html>

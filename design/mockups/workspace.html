<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOD — Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* NOD — two-column workspace. One global header, a dimmed recap of the last
   frame on the left, the single active frame on the right (on paper, no outer
   card). Calm Apple-style judgement: large type, whitespace, one action, few
   borders. Square corners, warm paper, one blue. Logic reuses flow.js. */
:root{
  --bg:#F6F5F1; --card:#FFFFFF; --tint:#EEEDE6; --blue-paper:rgba(47,111,224,0.05);
  --ink:#1A1A1A; --ink-2:#3A3A3A; --ink-soft:#5F5F58; --ink-faint:#6B6B61;
  --line:#E4E3DC; --line-2:#D8D7CF;
  --blue:#2F6FE0; --blue-deep:#1E52B0; --blue-tint:rgba(47,111,224,0.08); --blue-tint-2:rgba(47,111,224,0.16);
  --serif:"Spectral",Georgia,serif; --sans:"Hanken Grotesk",system-ui,sans-serif;
  --sh-card:0 1px 2px rgba(28,40,72,0.05),0 14px 30px -18px rgba(28,40,72,0.20);
  --sh-lift:0 6px 16px -8px rgba(30,50,90,0.14),0 26px 50px -24px rgba(30,50,90,0.26);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;caret-color:var(--blue);}
::selection{background:var(--blue-tint-2);color:var(--blue-deep);}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;}
button,input,textarea{font-family:inherit;color:inherit;}

.stage{width:100%;max-width:1260px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:44px 28px;}

/* ---- global header: persistent Brand Lockup (application chrome, never animates) ---- */
.ghead{display:flex;align-items:center;gap:16px;min-height:78px;}
.ghead .logo{width:56px;height:56px;border-radius:16px;background:var(--blue);display:grid;place-items:center;
  box-shadow:0 9px 20px -8px rgba(47,111,224,0.5);flex:none;}
.ghead .gtext{display:flex;flex-direction:column;justify-content:center;}
.ghead .gname{display:block;font-weight:800;font-size:29px;letter-spacing:-0.02em;line-height:1;}
.ghead .gtag{display:block;font-weight:600;font-size:15px;color:var(--blue-deep);margin-top:6px;line-height:1;letter-spacing:0;white-space:nowrap;}
.ghair{display:block;height:1px;background:var(--line);margin:20px 0 0;}

/* ---- two columns (share the header's left edge; centred in the space below the fixed header) ---- */
/* Top-anchored so the active heading holds a stable Y as frame height changes
   between states (Chunk 8); recap top-aligns with the active title. */
.cols{display:grid;grid-template-columns:440px minmax(0,700px);gap:64px;align-items:start;flex:1;align-content:start;padding-top:52px;}

/* ---- left: dimmed recap of the previous frame ---- */
.recap-empty{color:var(--ink-faint);font-size:13.5px;line-height:1.6;max-width:30ch;padding-top:6px;}
.recap{background:var(--tint);border-left:2px solid var(--blue-tint-2);padding:28px 30px;animation:pop .34s cubic-bezier(.16,1,.3,1);}
.recap-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 18px;}
.recap-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
/* >=44px hit area (design.md) via padding, negative margin keeps the visual footprint */
.recap-edit{border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--blue);cursor:pointer;padding:14px 12px;margin:-14px -12px;line-height:1.2;transition:color .18s;}
.recap-edit:hover{color:var(--blue-deep);}
.recap-value{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.18;letter-spacing:-0.014em;color:var(--ink);margin:0;overflow-wrap:break-word;}
.recap-extra{margin:20px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink-soft);}
.recap-extra b{display:block;color:var(--ink-2);font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:5px;}
@keyframes pop{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* ---- right: the active frame, on paper ---- */
.active{transition:transform .26s ease,opacity .26s ease;}
.cols.out .active{transform:translateX(26px);opacity:0;}
.cols.in .active{animation:slideIn .44s cubic-bezier(.16,1,.3,1);}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){ .active,.recap{animation:none!important;transition:none!important;} }

.f-title{font-family:var(--serif);font-weight:600;font-size:clamp(28px,3.4vw,39px);line-height:1.08;letter-spacing:-0.018em;margin:0 0 12px;}
.f-title em{font-style:italic;color:var(--blue-deep);}
.f-lede{margin:0 0 36px;color:var(--ink-soft);font-size:15.5px;line-height:1.55;max-width:56ch;}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:9999px;
  background:var(--blue);color:#fff;font-weight:600;font-size:15px;padding:14px 28px;cursor:pointer;
  box-shadow:0 8px 20px -10px rgba(47,111,224,0.6);transition:background .2s,transform .12s,opacity .2s;}
.btn:hover{background:var(--blue-deep);} .btn:active{transform:scale(.98);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn svg{transition:transform .24s;} .btn:hover:not(:disabled) svg{transform:translateX(3px);}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;padding:14px 4px;} .btn.ghost:hover{color:var(--blue);}
.linkbtn{border:0;background:transparent;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;padding:6px 2px;transition:color .2s;} .linkbtn:hover{color:var(--blue);}
.actions{display:flex;align-items:center;gap:18px;margin-top:34px;flex-wrap:wrap;}
.actions .hint{font-size:12.5px;color:var(--ink-faint);}

/* progressively-revealed fields, bottom-border only */
.field{margin-bottom:30px;}
.field.reveal{animation:fieldIn .42s cubic-bezier(.16,1,.3,1);}
@keyframes fieldIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.field label{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-bottom:11px;}
.field label .lblopt{font-weight:400;color:var(--ink-faint);font-size:12.5px;margin-left:8px;letter-spacing:.02em;}
.field .ipt{border-bottom:1.5px solid var(--line-2);transition:border-color .2s;}
.field .ipt:focus-within{border-color:var(--blue);}
.field input,.field textarea{width:100%;border:0;background:transparent;font-size:17px;color:var(--ink);padding:9px 2px;line-height:1.5;resize:none;}
.field input:focus,.field textarea:focus{outline:none;}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-faint);font-size:15.5px;}
.field .eg{margin:9px 2px 0;font-size:12.5px;color:var(--ink-faint);line-height:1.5;}
.masknote{display:none;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink-soft);}
.masknote.show{display:inline-flex;} .masknote svg{color:var(--blue);flex:none;} .masknote b{color:var(--ink-2);font-weight:600;}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;} .suggest.hide{display:none;}
.suggest .sl{width:100%;font-size:12px;color:var(--ink-faint);margin:0 0 2px;}
.chip{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--line-2);background:var(--card);font-size:12.5px;font-weight:500;color:var(--ink-soft);padding:0 16px;cursor:pointer;transition:border-color .18s,color .18s,background .18s;}
.chip:hover{border-color:var(--blue);color:var(--blue-deep);background:var(--blue-tint);}
.privacy{margin:0 0 34px;font-size:13px;color:var(--ink-faint);line-height:1.5;}

/* shared "your message" surface — compose textarea, feedback message, saved message all match */
.composer{background:var(--card);border:1px solid var(--line);padding:20px 22px;transition:border-color .2s;}
.composer:focus-within{border-color:var(--blue);}
.composer textarea{width:100%;border:0;background:transparent;font-size:16.5px;line-height:1.74;color:var(--ink);resize:vertical;min-height:140px;padding:0;outline:none;}
.composer textarea::placeholder{color:var(--ink-faint);}
/* compact brief — keeps the user's real task (recipient/context/ask) visible in the writing frame (journey.md §3 ④a). Not a card, not a third column. */
.brief{margin:0 0 22px;display:grid;gap:11px;}
.brief .bi{display:flex;gap:16px;align-items:baseline;}
.brief .bk{flex:none;width:78px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding-top:1px;}
.brief .bv{font-size:14.5px;line-height:1.5;color:var(--ink-2);overflow-wrap:break-word;min-width:0;}

/* choose: one primary card + plain text-link fallback */
.primary-path{display:block;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--sh-card);padding:26px 28px;transition:transform .26s cubic-bezier(.16,1,.3,1),box-shadow .26s,border-color .22s;}
.primary-path:hover,.primary-path:focus-visible{transform:translateY(-3px);box-shadow:var(--sh-lift);border-color:var(--blue);outline:none;}
.primary-path .pp-k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);margin:0 0 14px;}
.primary-path .pp-row{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.primary-path .pp-title{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.12;color:var(--ink);}
.primary-path .pp-arrow{flex:none;color:var(--blue);transition:transform .24s;} .primary-path:hover .pp-arrow{transform:translateX(4px);}
.primary-path .pp-sub{margin:10px 0 0;font-size:14px;line-height:1.5;color:var(--ink-soft);max-width:48ch;}
.secondary-path{margin-top:30px;padding-top:26px;border-top:1px solid var(--line);}
.secondary-path .sp-q{font-size:14.5px;font-weight:700;color:var(--ink-2);margin:0 0 7px;}
.secondary-path .sp-copy{font-size:14px;line-height:1.55;color:var(--ink-soft);margin:0 0 14px;max-width:54ch;}
.secondary-path .sp-link{border:0;background:transparent;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--blue);cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:8px;transition:color .2s;}
.secondary-path .sp-link:hover{color:var(--blue-deep);} .secondary-path .sp-link svg{transition:transform .24s;} .secondary-path .sp-link:hover svg{transform:translateX(3px);}

/* draft / spot-the-flaw */
.mailto{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;} .mailto b{color:var(--ink-2);font-weight:600;} .mailto .masked{margin-left:6px;font-size:11.5px;color:var(--blue-deep);font-weight:600;}
.spotq{font-size:14px;font-weight:600;color:var(--ink-2);margin:0 0 14px;display:flex;align-items:center;gap:8px;} .spotq svg{color:var(--blue);}
.lines{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
/* selectable rows: a resting border makes them clearly tappable, not plain paragraphs */
.line{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);font-size:16.5px;line-height:1.6;color:var(--ink);cursor:pointer;padding:14px 16px;margin:0;transition:border-color .18s,background .18s,transform .18s;}
.lines.picking .line:hover,.lines.picking .line:focus-visible{border-color:var(--blue);background:var(--blue-tint);transform:translateX(2px);outline:none;}
.line:disabled{cursor:default;}
.line.weak{border-color:var(--ink-faint);background:rgba(124,124,115,0.09);cursor:default;}
.line.picked{border-color:var(--line-2);background:rgba(124,124,115,0.06);cursor:default;}
.reaction{display:none;margin-top:16px;padding:18px 20px;background:var(--tint);}
.reaction.show{display:block;animation:fieldIn .42s cubic-bezier(.16,1,.3,1);}
.reaction .rk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--blue-deep);margin-bottom:8px;} .reaction .rk svg{color:var(--blue);}
.reaction p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-soft);} .reaction p b{color:var(--ink-2);font-weight:600;}

/* feedback */
.msgbox{font-size:16.5px;line-height:1.74;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:26px 28px;}
.msgbox p{margin:0 0 15px;} .msgbox p:last-child{margin-bottom:0;}
.flag{border-bottom:2px dotted var(--ink-faint);background:rgba(124,124,115,0.08);padding:0 2px;}
.flag.cleared{border-bottom:2px solid var(--blue);background:var(--blue-tint);}
.fix{margin-top:20px;padding:24px 26px;background:var(--tint);}
.fix .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 14px;}
.fix .row{margin:0 0 14px;} .fix .rlabel{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 6px;}
.fix .quote{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink);line-height:1.45;}
.fix .why{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0;}
.fix .suggest2{font-family:var(--serif);font-size:16px;color:var(--blue-deep);line-height:1.45;}
.strength{display:flex;gap:9px;align-items:flex-start;margin-top:18px;font-size:13.5px;color:var(--ink-soft);line-height:1.55;} .strength svg{color:var(--blue);flex:none;margin-top:2px;} .strength b{color:var(--ink-2);font-weight:600;}
.proto{margin-top:15px;font-size:11.5px;color:var(--ink-faint);line-height:1.5;border-left:2px solid var(--line-2);padding-left:12px;}
.readybadge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue-deep);margin-bottom:12px;} .readybadge svg{color:var(--blue);}
.final{font-size:16.5px;line-height:1.74;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:26px 28px;margin-bottom:18px;}
.final p{margin:0 0 15px;} .final p:last-child{margin-bottom:0;}
.copied{margin-left:12px;font-size:13px;font-weight:600;color:var(--blue-deep);opacity:0;transition:opacity .2s;} .copied.show{opacity:1;}
/* Saved-message list (journey.md §6): plain rows, not a dashboard. */
.saved{margin-top:44px;}
.saved h3{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px;}
.srow{display:flex;align-items:center;gap:14px;padding:15px 2px;border-top:1px solid var(--line);}
.srow:last-child{border-bottom:1px solid var(--line);}
.srow .stick{color:var(--blue);flex:none;display:inline-flex;}
.srow .smain{min-width:0;flex:1;}
.srow .stitle{font-size:14.5px;font-weight:600;color:var(--ink);}
.srow .speek{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.srow .sctx{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.srow .smeta{font-size:12.5px;color:var(--ink-faint);flex:none;}
.srow .schip{font-size:11px;font-weight:600;color:var(--blue-deep);background:var(--blue-tint);padding:3px 9px;flex:none;}
.srow .sreuse{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;flex:none;padding:6px 2px;transition:color .18s;}
.srow .sreuse:hover{color:var(--blue-deep);}
/* one calm outcome-tied next-use cue (journey.md §7). Not a streak/reminder/habit. */
.nextcue{margin-top:40px;padding-top:26px;border-top:1px solid var(--line);}
.nextcue p{margin:0 0 12px;font-size:14.5px;line-height:1.55;color:var(--ink-soft);max-width:54ch;}
.nextcue .nc-link{border:0;background:transparent;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--blue);cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;gap:7px;transition:color .18s;}
.nextcue .nc-link:hover{color:var(--blue-deep);} .nextcue .nc-link svg{transition:transform .24s;} .nextcue .nc-link:hover svg{transform:translateX(3px);}

/* ---- responsive: never squeeze the two desktop columns; stack with the
   editable recap directly ABOVE the dominant active frame ---- */
@media(max-width:1160px){
  .cols{grid-template-columns:minmax(0,700px);gap:22px;justify-content:center;align-content:start;padding-top:0;}
  .col-prev{order:1;} .col-active{order:2;}
  .recap{padding:20px 22px;} .recap-value{font-size:21px;}
  .ghair{margin:20px 0 32px;}
}
@media(max-width:560px){
  .stage{padding:28px 18px;}
  .ghead{gap:13px;}
  .ghead .gtag{white-space:normal;}   /* let the tagline wrap instead of clipping/overflowing */
  .f-title{font-size:clamp(25px,7vw,31px);}
  .composer textarea{min-height:128px;}
  .cols{padding-top:0;}
}
</style>
</head>
<body>
<div class="stage">

  <header class="ghead">
    <span class="logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6A2.5 2.5 0 0 1 17.5 15H9l-4 3.5V15H6.5" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 9.2l1.8 1.8 3.4-3.7" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="gtext"><span class="gname">NOD</span><span class="gtag">Your coach against the AI slop — so the skill sticks</span></span>
  </header>
  <div class="ghair"></div>

  <div class="cols" id="cols">
    <div class="col-prev" id="colPrev"></div>
    <div class="col-active"><div class="active" id="colActive"></div></div>
  </div>

</div>

<script src="shared/flow.js"></script>
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var store = window.NOD ? NOD.store : {load:function(){return{};},save:function(){},get:function(_,f){return f;}};
  if(window.NOD){ var _prev=NOD.store.load(); var _hist=Array.isArray(_prev.history)?_prev.history:[]; NOD.store.clear(); NOD.store.save({scenario:'',path:'own',tone:'warm',who:'',ask:'',ctx:'',ownText:'',flawPick:null,reuseSeed:'',history:_hist}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  /* Privacy (Decision 9): the recipient's real name stays device-local (localStorage
     is display-only, never a network payload here); the only "processing" boundary in
     this prototype is the evaluator, so the name is masked to [name] before it is passed
     to evaluateText, and unmasked for on-screen display. Reversible, so highlighting
     still lands on the user's real words. Real backend/model masking is server-side at build. */
  function maskName(text,name){ if(!name||name==='there')return String(text); var re=new RegExp('\\b'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi'); return String(text).replace(re,'[name]'); }
  function unmaskName(text,name){ if(!name||name==='there')return String(text); return String(text).replace(/\[name\]/g,name); }

  var SITU=[
    {id:'quiet',title:'A prospect went quiet',desc:'Restart the conversation without sounding pushy.',writing:'A follow-up message'},
    {id:'cold',title:'Reach out to someone new',desc:'Write a personalized first message.',writing:'A first message'},
    {id:'meeting',title:'Book a meeting or demo',desc:'Turn interest into a conversation.',writing:'A meeting request'},
    {id:'event',title:'Follow up after an event',desc:'Reconnect while it’s still fresh.',writing:'An event follow-up'}
  ];
  function situ(id){ return SITU.filter(function(x){return x.id===id;})[0]; }
  var ORDER=['situation','details','choose','draft','feedback','done'];
  var activeIndex=0;
  var cols=document.getElementById('cols'), colPrev=document.getElementById('colPrev'), colActive=document.getElementById('colActive');

  function go(i){
    if(reduce){ activeIndex=i; renderAll(); return; }
    cols.classList.remove('in'); cols.classList.add('out');
    setTimeout(function(){ activeIndex=i; renderAll(); cols.classList.remove('out'); void colActive.offsetWidth; cols.classList.add('in'); },210);
  }
  function advance(){ go(activeIndex+1); }
  function edit(i){ go(i); }
  function renderAll(){ renderPrev(); renderActive(); }

  /* Editing a prior frame must never leave contradictory downstream state
     (locked interaction model). When a committed value actually changes, wipe
     everything derived from it before saving the new value. Same-value re-commits
     preserve downstream work. history (past saved artifacts) is never wiped. */
  function resetFor(frameKey){
    var draft={ownText:'',flawPick:null,finalText:'',feedbackDone:false,fbOutcome:''};
    if(frameKey==='situation'){ draft.who=''; draft.ask=''; draft.ctx=''; draft.path='own'; return draft; }
    if(frameKey==='details') return draft;       // keep scenario + path; reset the draft + its result
    if(frameKey==='choose') return draft;         // a different path means a different working draft
    if(frameKey==='draft') return {finalText:'',feedbackDone:false,fbOutcome:''}; // draft changed -> result stale
    return {};
  }
  function commitFrame(frameKey, values){
    var s=store.load(), changed=false, k;
    for(k in values){ if(Object.prototype.hasOwnProperty.call(values,k)){ var a=s[k]==null?'':s[k], b=values[k]==null?'':values[k]; if(String(a)!==String(b)) changed=true; } }
    if(changed) store.save(resetFor(frameKey));
    store.save(values);
  }

       the copy-to-send action (r_done). The live `who` stays plaintext for the active draft
       (device-local) and is reset on reload — only `history` survives a reload, and it's masked. */
    document.getElementById('saveMsg').addEventListener('click',function(){ var t=maskName(finishText(),nm); var sc=NOD.scenario(s.scenario||'quiet'); var title=s.scenario==='custom'?(s.customText||sc.artTitle||'Your message'):(sc.artTitle||'Your message'); var entry={title:title,scenario:s.scenario||'quiet',peek:t.split('\n')[0],text:t,ask:s.ask||'',ts:Date.now(),when:'just now',path:s.path,unaided:s.path==='own'}; var hist=Array.isArray(s.history)?s.history.slice():[]; hist.unshift(entry); store.save({finalText:t,history:hist,feedbackDone:true,fbOutcome:fbOutcome||'clean'}); advance(); });
  }

  function r_done(){
    var s=store.load(); var t=s.finalText||''; var paras=t.split(/\n\s*\n/).filter(function(x){return x.trim();}); if(paras.length<=1)paras=t.split('\n').filter(function(x){return x.trim();});
    var hist=Array.isArray(s.history)?s.history:[];
    var tick='<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M3 10.5l3.2 3L17 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    function relTime(ts){ if(!ts)return'earlier'; var m=Math.floor((Date.now()-ts)/60000); if(m<1)return'just now'; if(m<60)return m+'m ago'; var h=Math.floor(m/60); if(h<24)return h+'h ago'; var dd=Math.floor(h/24); if(dd===1)return'yesterday'; if(dd<7)return dd+'d ago'; return Math.floor(dd/7)+'w ago'; }
    var savedList = hist.length ? ('<div class="saved"><h3>Your saved messages</h3>'+hist.map(function(e,i){
        return '<div class="srow"><span class="stick">'+tick+'</span>'
          +'<div class="smain"><div class="stitle">'+esc(e.title||'Your message')+'</div><div class="speek">'+esc(e.peek||'')+'</div>'+(e.ask?'<div class="sctx">Asked for: '+esc(e.ask)+'</div>':'')+'</div>'
          +(i===0?'<span class="schip">Just saved</span>':'<span class="smeta">'+esc(relTime(e.ts))+'</span>')
          +'<button class="sreuse" type="button" data-i="'+i+'">Reuse →</button></div>';
      }).join('')+'</div>') : '';
    var CUE={quiet:['Got another prospect who’s gone quiet? Do the next one yourself — I’ll jump in if you get stuck.','Write another follow-up'],cold:['Someone new to reach out to? Write the next one yourself — I’ll jump in if you get stuck.','Write another intro'],meeting:['Another meeting to line up? Write the next one yourself — I’ll jump in if you get stuck.','Write another request'],event:['Another contact to follow up with? Write the next one yourself — I’ll jump in if you get stuck.','Write another follow-up']};
    var cue=CUE[s.scenario]||CUE.quiet;
    var arrow='<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    var cueHtml='<div class="nextcue"><p>'+esc(cue[0])+'</p><button class="nc-link" type="button" id="nextSame">'+esc(cue[1])+' '+arrow+'</button></div>';
    colActive.innerHTML='<span class="readybadge">'+tick+'Prototype check · saved</span>'
      +'<h2 class="f-title" style="margin-top:10px">It’s ready — <em>and it’s yours to keep.</em></h2>'
      +'<p class="f-lede">Copy it and send it your way. '+(s.path==='own'?'You wrote this one.':'You started from a NOD draft — and sharpened it.')+'</p>'
      +'<div class="final">'+paras.map(function(p){return '<p>'+esc(p.trim())+'</p>';}).join('')+'</div>'
      +'<div class="actions"><button class="btn" id="copyMsg" type="button"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7 7V4.5A1.5 1.5 0 0 1 8.5 3h7A1.5 1.5 0 0 1 17 4.5v7A1.5 1.5 0 0 1 15.5 13H13M4.5 7h7A1.5 1.5 0 0 1 13 8.5v7A1.5 1.5 0 0 1 11.5 17h-7A1.5 1.5 0 0 1 3 15.5v-7A1.5 1.5 0 0 1 4.5 7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Copy message</button><span class="copied" id="copied">Copied — with your real names filled in.</span><button class="btn ghost" id="again" type="button">Start another →</button></div>'
      +savedList+cueHtml;
    /* Copy-to-send is the ONLY place the real recipient name is restored (FAQ contract). */
    document.getElementById('copyMsg').addEventListener('click',function(){ var out=unmaskName(t,NOD.firstName(s.who||'')); if(navigator.clipboard)navigator.clipboard.writeText(out).catch(function(){}); var c=document.getElementById('copied'); c.classList.add('show'); setTimeout(function(){c.classList.remove('show');},2400); });
    // Start another / Reuse begin a fresh attempt WITHOUT wiping saved history.
    function freshAttempt(seed){ store.save({scenario:'',path:'own',tone:'warm',who:'',ask:'',ctx:'',ownText:'',flawPick:null,finalText:'',feedbackDone:false,fbOutcome:'',reuseSeed:seed||''}); go(0); }
    document.getElementById('again').addEventListener('click',function(){ freshAttempt(''); });
    [].slice.call(colActive.querySelectorAll('.sreuse')).forEach(function(b){ b.addEventListener('click',function(){ var e=hist[parseInt(b.dataset.i,10)]; freshAttempt(e?e.text:''); }); });
    // outcome-tied next-use cue: another one in the SAME situation, write-your-own, help thinner
    var ns=document.getElementById('nextSame'); if(ns)ns.addEventListener('click',function(){ store.save({path:'own',tone:'warm',who:'',ask:'',ctx:'',ownText:'',flawPick:null,finalText:'',feedbackDone:false,fbOutcome:'',reuseSeed:''}); go(1); });
  }

  renderAll(); cols.classList.add('in');
})();
</script>
</body>
</html>
